version: "3.8"

services:
  # 1. Konfigurasi Database MySQL
  db:
    image: mysql:8.0
    container_name: mysql-database
    restart: always
    environment:
      MYSQL_DATABASE: manajemen_data_fuzzy
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 2. Konfigurasi Backend Service
  backend:
    build: ./BackendService
    container_name: Backend-Service
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./BackendService:/var/www/html
    depends_on:
      - db

  # 3. Konfigurasi Fuzzy/Evaluator Service
  evaluator:
    build: ./EvaluatorService
    container_name: Evaluator-Service
    restart: always
    ports:
      - "8001:80"
    volumes:
      - ./EvaluatorService:/var/www/html

  # 4. Konfigurasi Nginx (Frontend + Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./FrontendService/dist:/var/www/frontend:ro
    depends_on:
      - backend

# Mengamankan data database agar tidak hilang saat Docker dimatikan
volumes:
  db_data:
