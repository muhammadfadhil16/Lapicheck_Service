name: Laravel CI

on:
  push:
    branches: [production, staging, development, main]
  pull_request:
    branches: [production, staging, development, main]

jobs:
  laravel:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [BackendService, EvaluatorService]

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, sqlite, pdo_sqlite, zip, bcmath
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ matrix.service }}/vendor
          key: ${{ runner.os }}-${{ matrix.service }}-composer-${{ hashFiles(format('{0}/composer.lock', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.service }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
